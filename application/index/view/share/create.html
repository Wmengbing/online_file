{extend name="common/layout" /}

{block name="content"}
<div class="row">
    <div class="col-md-6 col-md-offset-3">
        <div class="content-box">
            <h3><i class="fa fa-share"></i> 创建分享链接</h3>
            <hr>
            <form id="shareForm">
                <input type="hidden" name="file_id" value="{$file_id}">
                <div class="form-group">
                    <label>
                        <input type="checkbox" name="has_password" value="1"> 设置提取码
                    </label>
                </div>
                <div class="form-group">
                    <label>有效期</label>
                    <select class="form-control" name="expire_days">
                        <option value="0">永久有效</option>
                        <option value="1">1天</option>
                        <option value="7">7天</option>
                        <option value="30">30天</option>
                        <option value="90">90天</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fa fa-share"></i> 创建分享</button>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="shareResultModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">分享链接创建成功</h4>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>分享链接</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="shareUrl" readonly>
                        <span class="input-group-btn">
                            <button class="btn btn-default" onclick="copyToClipboard('#shareUrl')">复制</button>
                        </span>
                    </div>
                </div>
                <div class="form-group" id="passwordGroup" style="display:none;">
                    <label>提取码</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="sharePassword" readonly>
                        <span class="input-group-btn">
                            <button class="btn btn-default" onclick="copyToClipboard('#sharePassword')">复制</button>
                        </span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script>
$('#shareForm').on('submit', function(e) {
    e.preventDefault();
    $.post('{:url("index/share/create")}', $(this).serialize(), function(res) {
        if (res.code == 200) {
            $('#shareUrl').val(res.data.share_url);
            if (res.data.password) {
                $('#sharePassword').val(res.data.password);
                $('#passwordGroup').show();
            } else {
                $('#passwordGroup').hide();
            }
            $('#shareResultModal').modal('show');
        } else {
            layer.msg(res.msg || '创建失败', {icon: 2});
        }
    }, 'json');
});

function copyToClipboard(selector) {
    var input = $(selector);
    input.select();
    document.execCommand('copy');
    layer.msg('已复制到剪贴板', {icon: 1});
}
</script>
{/block}

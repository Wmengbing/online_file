{extend name="common/layout" /}

{block name="title"}上传文件 - 文件共享系统{/block}

{block name="content"}
<div class="row">
    <div class="col-md-8 col-md-offset-2">
        <div class="content-box">
            <h3><i class="fa fa-upload"></i> 上传文件 <a href="{:url('index/file/index', ['parent_id' => $parent_id])}" class="btn btn-default btn-sm pull-right">返回文件列表</a></h3>
            <p class="text-muted">
                支持多文件与拖拽上传,超过 {$chunk_size_text} 自动分片并发上传,支持断点续传
            </p>
            <hr>

            <!-- 拖拽区 -->
            <div id="dropZone" class="text-center" style="border: 2px dashed #ccc; border-radius: 6px; padding: 35px; cursor: pointer; background: #fafafa;">
                <i class="fa fa-cloud-upload" style="font-size: 42px; color: #337ab7;"></i>
                <p style="margin-top: 10px;">将文件拖到此处,或 <a href="javascript:;" onclick="$('#fileInput').trigger('click')">点击选择文件</a></p>
                <input type="file" id="fileInput" multiple style="display: none;">
            </div>

            <!-- 队列 -->
            <table class="table table-striped" id="queueTable" style="display: none; margin-top: 15px;">
                <thead>
                    <tr>
                        <th>文件</th>
                        <th width="110">大小</th>
                        <th width="200">进度</th>
                        <th width="110">状态</th>
                        <th width="70">操作</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <div style="margin-top: 15px;">
                <button type="button" class="btn btn-primary" id="startAllBtn"><i class="fa fa-play"></i> 开始上传</button>
                <button type="button" class="btn btn-default" id="clearAllBtn">清空列表</button>
            </div>
        </div>
    </div>
</div>
{/block}

{block name="script"}
<script>
var PARENT_ID = {$parent_id};
var CHUNK_SIZE = {$chunk_size};
var uploads = [];       // 队列
var running = 0;
var MAX_CONCURRENT = 2;
var CHUNK_CONCURRENT = 3;

// ---------- 队列管理 ----------
function addFiles(fileList) {
    for (var i = 0; i < fileList.length; i++) {
        var f = fileList[i];
        var same = uploads.filter(function(u) { return u.name === f.name && u.size === f.size && u.status !== 'done'; });
        if (same.length > 0) { continue; }
        uploads.push({
            id: Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2, 8),
            file: f, name: f.name, size: f.size,
            needChunk: f.size > CHUNK_SIZE,
            upload_id: null, total_chunks: Math.ceil(f.size / CHUNK_SIZE),
            status: 'wait',        // wait/running/done/error
            progress: 0,
            errorMsg: ''
        });
    }
    renderQueue();
}

function renderQueue() {
    var $tb = $('#queueTable tbody').empty();
    if (uploads.length === 0) { $('#queueTable').hide(); return; }
    $('#queueTable').show();

    uploads.forEach(function(u) {
        var statusText = {wait: '等待中', running: '上传中', done: '完成', error: '失败'}[u.status] || u.status;
        var color = {wait: 'text-muted', running: 'text-info', done: 'text-success', error: 'text-danger'}[u.status] || '';
        var html = '<tr data-id="' + u.id + '">'
            + '<td class="file-name">' + $('<span>').text(u.name).html()
            + (u.needChunk ? ' <small class="text-muted">(分片)</small>' : '') + '</td>'
            + '<td>' + formatSize(u.size) + '</td>'
            + '<td><div class="progress" style="margin: 0; height: 16px;"><div class="progress-bar" role="progressbar" style="width:' + u.progress + '%">' + u.progress + '%</div></div></td>'
            + '<td class="' + color + '">' + statusText + (u.errorMsg ? '<br><small>' + $('<span>').text(u.errorMsg).html() + '</small>' : '') + '</td>'
            + '<td>' + (u.status !== 'running' && u.status !== 'done' ? '<button class="btn btn-xs btn-danger" onclick="removeUpload(\'' + u.id + '\')"><i class="fa fa-times"></i></button>' : '') + '</td>'
            + '</tr>';
        $tb.append(html);
    });
}

function removeUpload(id) {
    uploads = uploads.filter(function(u) { return u.id !== id; });
    renderQueue();
}

function setUpload(id, patch) {
    uploads.forEach(function(u) { if (u.id === id) { for (var k in patch) u[k] = patch[k]; } });
    renderQueue();
}

// ---------- 上传执行 ----------
function startAll() {
    var pending = uploads.filter(function(u) { return u.status === 'wait' || u.status === 'error'; });
    if (pending.length === 0) { layer.msg('没有等待上传的文件', {icon: 0}); return; }
    $('#startAllBtn').prop('disabled', true);
    pumpQueue();
}

function pumpQueue() {
    while (running < MAX_CONCURRENT) {
        var u = null;
        for (var i = 0; i < uploads.length; i++) {
            if (uploads[i].status === 'wait' || uploads[i].status === 'error') { u = uploads[i]; break; }
        }
        if (!u) break;
        u.status = 'running';
        renderQueue();
        running++;
        (function(item) {
            item.needChunk ? uploadChunked(item) : uploadSingle(item);
        })(u);
    }
    // 全部结束后
    var active = uploads.filter(function(u) { return u.status === 'wait' || u.status === 'running' || u.status === 'error'; }).length;
    if (active === 0) {
        $('#startAllBtn').prop('disabled', false);
        var ok = uploads.filter(function(u) { return u.status === 'done'; }).length;
        if (uploads.length > 0) {
            layer.msg(ok + ' 个文件上传成功' + (ok < uploads.length ? ',部分失败请重试' : ''), {icon: ok === uploads.length ? 1 : 0, time: 1500}, function() {
                if (ok === uploads.length) {
                    window.location.href = '{:url("index/file/index", ["parent_id" => $parent_id])}';
                }
            });
        }
    }
}

function finishUpload(item, ok) {
    running--;
    item.status = ok ? 'done' : 'error';
    if (!ok && item.errorMsg.indexOf('空间') >= 0) {
        item.errorMsg = '存储空间不足';
    }
    renderQueue();
    pumpQueue();
}

// 小文件:整体上传
function uploadSingle(item) {
    var fd = new FormData();
    fd.append('file', item.file);
    fd.append('parent_id', PARENT_ID);
    $.ajax({
        url: '{:url("index/file/upload")}',
        type: 'POST',
        data: fd,
        processData: false,
        contentType: false,
        xhr: function() {
            var xhr = new XMLHttpRequest();
            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) { setUpload(item.id, {progress: Math.round(e.loaded / e.total * 100)}); }
            });
            return xhr;
        },
        success: function(res) {
            if (res && res.code == 200) { finishUpload(item, true); }
            else { item.errorMsg = (res && res.msg) || '上传失败'; finishUpload(item, false); }
        },
        error: function() { item.errorMsg = '网络错误'; finishUpload(item, false); }
    });
}

// 大文件:分片上传
function uploadChunked(item) {
    if (!item.upload_id) {
        // 第一步:初始化任务
        $.post('{:url("index/file/chunkInit")}', {file_name: item.name, total_size: item.size, parent_id: PARENT_ID}, function(res) {
            if (res.code !== 200) {
                item.errorMsg = res.msg || '初始化失败';
                finishUpload(item, false);
                return;
            }
            item.upload_id = res.data.upload_id;
            item.received = null;
            resumeChunked(item);
        }, 'json');
    } else {
        resumeChunked(item);
    }
}

// 查询已传分片后,补传缺失分片
function resumeChunked(item) {
    $.get('{:url("index/file/chunkStatus")}', {upload_id: item.upload_id, total_chunks: item.total_chunks}, function(res) {
        if (res.code !== 200) {
            item.errorMsg = res.msg || '状态查询失败';
            finishUpload(item, false);
            return;
        }
        var missing = res.data.remaining || [];
        var doneCount = item.total_chunks - missing.length;
        setUpload(item.id, {progress: Math.round(doneCount / item.total_chunks * 100)});
        sendChunks(item, missing);
    }, 'json');
}

function sendChunks(item, queue) {
    if (queue.length === 0) {
        mergeChunked(item);
        return;
    }
    var concurrent = Math.min(CHUNK_CONCURRENT, queue.length);
    var runningNow = 0;

    function next() {
        if (queue.length === 0) {
            if (--runningNow === 0) mergeChunked(item);
            return;
        }
        runningNow++;
        var idx = queue.shift();
        uploadOneChunk(item, idx, function(ok) {
            if (!ok) {
                item.errorMsg = '分片 ' + idx + ' 上传失败';
                finishUpload(item, false);
                return;
            }
            var total = item.total_chunks;
            var finished = total - queue.length - (runningNow > 0 ? runningNow - 1 : 0);
            setUpload(item.id, {progress: Math.min(99, Math.round(finished / total * 100))});
            next();
        });
    }

    for (var i = 0; i < concurrent; i++) next();
}

function uploadOneChunk(item, idx, cb) {
    var start = idx * CHUNK_SIZE;
    var blob = item.file.slice(start, Math.min(start + CHUNK_SIZE, item.size));

    var fd = new FormData();
    fd.append('upload_id', item.upload_id);
    fd.append('index', idx);
    fd.append('total_chunks', item.total_chunks);
    fd.append('file_name', item.name);
    fd.append('total_size', item.size);
    fd.append('file', blob, 'part');

    var attempt = 0;
    (function attemptSend() {
        $.ajax({
            url: '{:url("index/file/chunkUpload")}',
            type: 'POST',
            data: fd,
            processData: false,
            contentType: false,
            success: function(res) {
                if (res && res.code == 200) cb(true);
                else {
                    if (res && (res.code == 400 || res.code == 401)) { cb(false); return; }
                    if (++attempt < 3) { setTimeout(attemptSend, 800 * attempt); }
                    else cb(false);
                }
            },
            error: function() {
                if (++attempt < 3) { setTimeout(attemptSend, 800 * attempt); }
                else cb(false);
            }
        });
    })();
}

function mergeChunked(item) {
    $.post('{:url("index/file/chunkMerge")}', {
        upload_id: item.upload_id,
        file_name: item.name,
        parent_id: PARENT_ID,
        total_chunks: item.total_chunks,
        total_size: item.size
    }, function(res) {
        if (res.code == 200) {
            setUpload(item.id, {progress: 100});
            finishUpload(item, true);
        } else {
            item.errorMsg = res.msg || '合并失败';
            finishUpload(item, false);
        }
    }, 'json');
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(2) + ' MB';
    return (bytes / 1073741824).toFixed(2) + ' GB';
}

// ---------- 事件绑定 ----------
$(function() {
    var $zone = $('#dropZone');
    $zone.on('click', function(e) { if (e.target.tagName !== 'A') $('#fileInput').trigger('click'); });
    $('#fileInput').on('change', function() { addFiles(this.files); this.value = ''; });
    $zone.on('dragover', function(e) { e.preventDefault(); $(this).css('border-color', '#337ab7').css('background', '#eef6ff'); });
    $zone.on('dragleave', function(e) { $(this).css('border-color', '#ccc').css('background', '#fafafa'); });
    $zone.on('drop', function(e) {
        e.preventDefault();
        $(this).css('border-color', '#ccc').css('background', '#fafafa');
        if (e.originalEvent.dataTransfer && e.originalEvent.dataTransfer.files.length) {
            addFiles(e.originalEvent.dataTransfer.files);
        }
    });
    $('#startAllBtn').on('click', startAll);
    $('#clearAllBtn').on('click', function() {
        uploads = uploads.filter(function(u) { return u.status === 'running' || u.status === 'done'; });
        renderQueue();
    });
});
</script>
{/block}

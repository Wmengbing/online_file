{extend name="common/layout" /}

{block name="title"}上传文件 - 文件共享系统{/block}

{block name="content"}
<style>
    .upload-page {
        position: relative;
        overflow: hidden;
    }
    .upload-page:before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, rgba(96,165,250,0.18), rgba(96,165,250,0));
        pointer-events: none;
    }
    .upload-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        position: relative;
        z-index: 1;
    }
    .upload-header h3 {
        margin: 0;
        color: #1e293b;
        font-weight: 700;
    }
    .upload-header h3 .fa {
        color: #2563eb;
        margin-right: 8px;
    }
    .upload-page .text-muted {
        color: #64748b !important;
    }
    .upload-dropzone {
        position: relative;
        z-index: 1;
        border: 2px dashed #bfdbfe;
        border-radius: 18px;
        padding: 38px 24px;
        cursor: pointer;
        background: linear-gradient(180deg, #f8fbff 0%, #eef6ff 100%);
        transition: all 0.25s ease;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }
    .upload-dropzone:hover,
    .upload-dropzone.dragover {
        border-color: #60a5fa;
        background: linear-gradient(180deg, #edf6ff 0%, #e0f2fe 100%);
        box-shadow: 0 12px 24px rgba(59, 130, 246, 0.08);
    }
    .upload-dropzone i {
        display: block;
        font-size: 48px;
        color: #3b82f6;
        margin-bottom: 12px;
        text-shadow: 0 8px 18px rgba(59,130,246,0.12);
    }
    .upload-dropzone p {
        margin: 0;
        font-size: 16px;
        color: #475569;
    }
    .upload-dropzone a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
    }
    .upload-dropzone a:hover {
        text-decoration: underline;
    }
    #queueTable {
        display: none;
        margin-top: 18px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
    }
    #queueTable th {
        white-space: nowrap;
    }
    #queueTable .file-name {
        font-weight: 600;
        color: #1e293b;
    }
    .upload-progress {
        margin: 0;
        height: 16px;
        background: #edf2ff;
        border-radius: 999px;
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .upload-progress .progress-bar {
        background: linear-gradient(90deg, #60a5fa, #2563eb);
        border-radius: 999px;
        line-height: 16px;
        font-size: 10px;
        color: #fff;
        min-width: 28px;
    }
    .upload-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        position: relative;
        z-index: 1;
    }
    .upload-actions .btn {
        min-width: 120px;
    }
    @media (max-width: 767px) {
        .upload-header {
            display: block;
        }
        .upload-header .pull-right {
            float: none !important;
            margin-top: 12px;
        }
        .upload-actions {
            flex-wrap: wrap;
        }
    }
</style>
<div class="row">
    <div class="col-md-8 col-md-offset-2">
        <div class="content-box upload-page">
            <div class="upload-header">
                <h3><i class="fa fa-upload"></i> 上传文件</h3>
                <div>
                    <a href="{:url('index/file/uploadTasks')}" class="btn btn-info btn-sm" style="margin-right: 8px;"><i class="fa fa-tasks"></i> 查看上传任务</a>
                    <a href="{:url('index/file/index', ['parent_id' => $parent_id])}" class="btn btn-default btn-sm">返回文件列表</a>
                </div>
            </div>
            <p class="text-muted">
                支持多文件与拖拽上传，超过 {$chunk_size_text} 自动分片并发上传，支持断点续传
            </p>
            <hr>

            <div id="dropZone" class="upload-dropzone text-center">
                <i class="fa fa-cloud-upload"></i>
                <p>将文件拖到此处，或 <a href="javascript:;" onclick="$('#fileInput').trigger('click')">点击选择文件</a></p>
                <input type="file" id="fileInput" multiple style="display: none;">
            </div>

            <table class="table table-striped" id="queueTable">
                <thead>
                    <tr>
                        <th>文件</th>
                        <th width="110">大小</th>
                        <th width="200">进度</th>
                        <th width="110">状态</th>
                        <th width="70">操作</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <div class="upload-actions">
                <button type="button" class="btn btn-primary" id="startAllBtn"><i class="fa fa-play"></i> 开始上传</button>
                <button type="button" class="btn btn-default" id="clearAllBtn">清空列表</button>
            </div>
        </div>
    </div>
</div>
{/block}

{block name="script"}
<script>
var PARENT_ID = {$parent_id};
var CHUNK_SIZE = {$chunk_size};
var uploads = [];       // 队列
var running = 0;
var MAX_CONCURRENT = 2;
var CHUNK_CONCURRENT = 3;
var summaryShown = false;   // 本批次完成提示只弹一次

// ---------- 队列管理 ----------
function addFiles(fileList) {
    summaryShown = false;
    for (var i = 0; i < fileList.length; i++) {
        var f = fileList[i];
        var same = uploads.filter(function(u) { return u.name === f.name && u.size === f.size && u.status !== 'done'; });
        if (same.length > 0) { continue; }
        uploads.push({
            id: Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2, 8),
            file: f, name: f.name, size: f.size,
            needChunk: f.size > CHUNK_SIZE,
            upload_id: null, total_chunks: Math.ceil(f.size / CHUNK_SIZE),
            status: 'wait',        // wait/running/done/error
            progress: 0,
            errorMsg: ''
        });
    }
    renderQueue();
}

function renderQueue() {
    var $tb = $('#queueTable tbody').empty();
    if (uploads.length === 0) { $('#queueTable').hide(); return; }
    $('#queueTable').show();

    uploads.forEach(function(u) {
        var statusText = {wait: '等待中', running: '上传中', done: '完成', error: '失败'}[u.status] || u.status;
        var color = {wait: 'text-muted', running: 'text-info', done: 'text-success', error: 'text-danger'}[u.status] || '';
        var html = '<tr data-id="' + u.id + '">'
            + '<td class="file-name">' + $('<span>').text(u.name).html()
            + (u.needChunk ? ' <small class="text-muted">(分片)</small>' : '') + '</td>'
            + '<td>' + formatSize(u.size) + '</td>'
            + '<td><div class="upload-progress"><div class="progress-bar" role="progressbar" style="width:' + u.progress + '%">' + u.progress + '%</div></div></td>'
            + '<td class="' + color + '">' + statusText + (u.errorMsg ? '<br><small>' + $('<span>').text(u.errorMsg).html() + '</small>' : '') + '</td>'
            + '<td>' + (u.status !== 'running' && u.status !== 'done' ? '<button class="btn btn-xs btn-danger" onclick="removeUpload(\'' + u.id + '\')"><i class="fa fa-times"></i></button>' : '') + '</td>'
            + '</tr>';
        $tb.append(html);
    });
}

function removeUpload(id) {
    uploads = uploads.filter(function(u) { return u.id !== id; });
    renderQueue();
}

function setUpload(id, patch) {
    uploads.forEach(function(u) { if (u.id === id) { for (var k in patch) u[k] = patch[k]; } });
    renderQueue();
}

// 只刷新进度条,不重建整张表(分片回调很频繁)
function setProgress(id, progress) {
    uploads.forEach(function(u) { if (u.id === id) { u.progress = progress; } });
    var $bar = $('#queueTable tbody tr[data-id="' + id + '"] .progress-bar');
    if ($bar.length) {
        $bar.css('width', progress + '%').text(progress + '%');
    } else {
        renderQueue();
    }
}

// ---------- 上传执行 ----------
function startAll() {
    var pending = uploads.filter(function(u) { return u.status === 'wait' || u.status === 'error'; });
    if (pending.length === 0) { layer.msg('没有等待上传的文件', {icon: 0}); return; }
    // 失败项重新入队(手动重试),避免失败后自动无限重传
    pending.forEach(function(u) { u.status = 'wait'; u.errorMsg = ''; });
    $('#startAllBtn').prop('disabled', true);
    renderQueue();
    pumpQueue();
}

function pumpQueue() {
    while (running < MAX_CONCURRENT) {
        var u = null;
        for (var i = 0; i < uploads.length; i++) {
            if (uploads[i].status === 'wait') { u = uploads[i]; break; }
        }
        if (!u) break;
        u.status = 'running';
        renderQueue();
        running++;
        (function(item) {
            item.needChunk ? uploadChunked(item) : uploadSingle(item);
        })(u);
    }

    // 没有等待/上传中的文件时,本批次结束
    var busy = uploads.filter(function(u) { return u.status === 'wait' || u.status === 'running'; }).length;
    if (busy > 0) return;

    $('#startAllBtn').prop('disabled', false);

    var ok = uploads.filter(function(u) { return u.status === 'done'; }).length;
    var failed = uploads.filter(function(u) { return u.status === 'error'; }).length;
    if (uploads.length > 0 && failed === 0 && !summaryShown) {
        summaryShown = true;
        layer.msg(ok + ' 个文件上传成功', {icon: 1, time: 1500}, function() {
            window.location.href = '{:url("index/file/index", ["parent_id" => $parent_id])}';
        });
    } else if (failed > 0) {
        layer.msg(failed + ' 个文件上传失败,请重试', {icon: 2, time: 1500});
    }
}

function finishUpload(item, ok) {
    running--;
    item.status = ok ? 'done' : 'error';
    if (!ok && item.errorMsg.indexOf('空间') >= 0) {
        item.errorMsg = '存储空间不足';
    }
    renderQueue();
    pumpQueue();
}

// 小文件:整体上传
function uploadSingle(item) {
    var fd = new FormData();
    fd.append('file', item.file);
    fd.append('parent_id', PARENT_ID);
    $.ajax({
        url: '{:url("index/file/upload")}',
        type: 'POST',
        data: fd,
        processData: false,
        contentType: false,
        xhr: function() {
            var xhr = new XMLHttpRequest();
            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) { setUpload(item.id, {progress: Math.round(e.loaded / e.total * 100)}); }
            });
            return xhr;
        },
        success: function(res) {
            if (res && res.code == 200) { finishUpload(item, true); }
            else { item.errorMsg = (res && res.msg) || '上传失败'; finishUpload(item, false); }
        },
        error: function() { item.errorMsg = '网络错误'; finishUpload(item, false); }
    });
}

// 大文件:分片上传
function uploadChunked(item) {
    if (!item.upload_id) {
        // 第一步:初始化任务
        $.post('{:url("index/file/chunkInit")}', {file_name: item.name, total_size: item.size, parent_id: PARENT_ID}, function(res) {
            if (res.code !== 200) {
                item.errorMsg = res.msg || '初始化失败';
                finishUpload(item, false);
                return;
            }
            item.upload_id = res.data.upload_id;
            item.received = null;
            resumeChunked(item);
        }, 'json').fail(function() {
            item.errorMsg = '初始化请求失败';
            finishUpload(item, false);
        });
    } else {
        resumeChunked(item);
    }
}

// 查询已传分片后,补传缺失分片
function resumeChunked(item) {
    $.get('{:url("index/file/chunkStatus")}', {upload_id: item.upload_id, total_chunks: item.total_chunks}, function(res) {
        if (res.code !== 200) {
            item.errorMsg = res.msg || '状态查询失败';
            finishUpload(item, false);
            return;
        }
        var missing = res.data.remaining || [];
        var doneCount = item.total_chunks - missing.length;
        setUpload(item.id, {progress: Math.round(doneCount / item.total_chunks * 100)});
        sendChunks(item, missing);
    }, 'json').fail(function() {
        item.errorMsg = '状态查询失败';
        finishUpload(item, false);
    });
}

function sendChunks(item, queue) {
    if (queue.length === 0) {
        mergeChunked(item);
        return;
    }

    var total = item.total_chunks;
    var finished = total - queue.length;   // 已存在的分片(断点续传时跳过)
    var cursor = 0;                        // 下一个待派发的分片下标
    var inFlight = 0;                      // 正在上传的分片数
    var remaining = queue.length;          // 本批次剩余未完成的分片数
    var settled = false;                   // 本批次是否已结束(合并/失败)

    function dispatch(idx) {
        inFlight++;
        uploadOneChunk(item, idx, function(ok) {
            inFlight--;
            if (settled) return;

            if (!ok) {
                settled = true;
                item.errorMsg = '分片 ' + (idx + 1) + '/' + total + ' 上传失败';
                finishUpload(item, false);
                return;
            }

            finished++;
            remaining--;
            setProgress(item.id, Math.min(99, Math.round(finished / total * 100)));

            if (remaining === 0) {
                settled = true;
                mergeChunked(item);
                return;
            }
            pump();
        });
    }

    function pump() {
        while (!settled && inFlight < CHUNK_CONCURRENT && cursor < queue.length) {
            dispatch(queue[cursor++]);
        }
    }

    pump();
}

function uploadOneChunk(item, idx, cb) {
    var start = idx * CHUNK_SIZE;
    var blob = item.file.slice(start, Math.min(start + CHUNK_SIZE, item.size));

    var fd = new FormData();
    fd.append('upload_id', item.upload_id);
    fd.append('index', idx);
    fd.append('total_chunks', item.total_chunks);
    fd.append('file_name', item.name);
    fd.append('total_size', item.size);
    fd.append('file', blob, 'part');

    var attempt = 0;
    (function attemptSend() {
        $.ajax({
            url: '{:url("index/file/chunkUpload")}',
            type: 'POST',
            data: fd,
            processData: false,
            contentType: false,
            timeout: 300000,   // 单个分片卡死超过5分钟则中断重试,避免进度永远停住
            success: function(res) {
                if (res && res.code == 200) cb(true);
                else {
                    if (res && (res.code == 400 || res.code == 401)) { cb(false); return; }
                    if (++attempt < 3) { setTimeout(attemptSend, 800 * attempt); }
                    else cb(false);
                }
            },
            error: function() {
                if (++attempt < 3) { setTimeout(attemptSend, 800 * attempt); }
                else cb(false);
            }
        });
    })();
}

function mergeChunked(item) {
    $.post('{:url("index/file/chunkMerge")}', {
        upload_id: item.upload_id,
        file_name: item.name,
        parent_id: PARENT_ID,
        total_chunks: item.total_chunks,
        total_size: item.size
    }, function(res) {
        if (res.code == 200) {
            setUpload(item.id, {progress: 100});
            finishUpload(item, true);
        } else {
            item.errorMsg = res.msg || '合并失败';
            finishUpload(item, false);
        }
    }, 'json').fail(function() {
        item.errorMsg = '合并请求失败';
        finishUpload(item, false);
    });
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(2) + ' MB';
    return (bytes / 1073741824).toFixed(2) + ' GB';
}

// ---------- 事件绑定 ----------
$(function() {
    var $zone = $('#dropZone');
    var $fileInput = $('#fileInput');
    var isTriggering = false;
    
    // 点击上传区域（排除链接）
    $zone.on('click', function(e) {
        if (isTriggering) return;
        if (e.target.tagName === 'A' || $(e.target).closest('a').length) return;
        
        isTriggering = true;
        e.preventDefault();
        e.stopPropagation();
        $fileInput.trigger('click');
        setTimeout(function() { isTriggering = false; }, 100);
    });
    
    // 文件选择变化
    $fileInput.on('change', function(e) {
        e.stopPropagation();
        addFiles(this.files);
        this.value = '';
    });
    
    // 拖拽事件
    $zone.on('dragover', function(e) {
        e.preventDefault();
        e.stopPropagation();
        $(this).addClass('dragover');
    });
    
    $zone.on('dragleave', function(e) {
        e.preventDefault();
        e.stopPropagation();
        $(this).removeClass('dragover');
    });
    
    $zone.on('drop', function(e) {
        e.preventDefault();
        e.stopPropagation();
        $(this).removeClass('dragover');
        if (e.originalEvent.dataTransfer && e.originalEvent.dataTransfer.files.length) {
            addFiles(e.originalEvent.dataTransfer.files);
        }
    });
    
    // 按钮事件
    $('#startAllBtn').on('click', startAll);
    $('#clearAllBtn').on('click', function() {
        uploads = uploads.filter(function(u) { return u.status === 'running' || u.status === 'done'; });
        renderQueue();
    });
});
</script>
{/block}

{extend name="common/layout" /}

{block name="content"}
<div class="row">
    <div class="col-md-6 col-md-offset-3">
        <div class="content-box">
            <h3><i class="fa fa-edit"></i> 重命名</h3>
            <hr>
            <form method="post" action="{:url('index/file/rename')}">
                <input type="hidden" name="file_id" value="{$file.id}">
                <div class="form-group">
                    <label>原名称</label>
                    <input type="text" class="form-control" value="{$file.name}" disabled>
                </div>
                <div class="form-group">
                    <label>新名称</label>
                    <input type="text" class="form-control" name="name" value="{$file.name}" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fa fa-save"></i> 保存</button>
            </form>
        </div>
    </div>
</div>
{/block}

{extend name="common/layout" /}

{block name="content"}
<style>
    .form-shell {
        min-height: calc(100vh - 180px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 0;
    }
    .form-card {
        width: 100%;
        max-width: 520px;
        background: rgba(255,255,255,0.96);
        border: 1px solid rgba(226,232,240,0.95);
        border-radius: 22px;
        box-shadow: 0 24px 50px rgba(15,23,42,0.10);
        padding: 28px 26px 22px;
        position: relative;
        overflow: hidden;
    }
    .form-card:before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, rgba(59,130,246,0.14), rgba(59,130,246,0));
    }
    .form-card > * { position: relative; z-index: 1; }
    .form-card h3 {
        margin: 0 0 18px;
        font-weight: 700;
        color: #0f172a;
    }
    .form-card h3 .fa {
        color: var(--primary);
        margin-right: 8px;
    }
    .form-card .form-group {
        margin-bottom: 18px;
    }
    .form-card label {
        color: #475569;
        font-weight: 600;
        margin-bottom: 8px;
    }
    .form-card .btn-block {
        width: 100%;
        min-height: 44px;
    }
    .form-card input[disabled] {
        background: #f8fafc;
    }
</style>
<div class="row form-shell">
    <div class="col-md-6 col-md-offset-3">
        <div class="form-card">
            <h3><i class="fa fa-edit"></i> 重命名</h3>
            <hr>
            <form method="post" action="{:url('index/file/rename')}" class="ajax-form">
                <input type="hidden" name="file_id" value="{$file.id}">
                <div class="form-group">
                    <label>原名称</label>
                    <input type="text" class="form-control" value="{$file.name}" disabled>
                </div>
                <div class="form-group">
                    <label>新名称</label>
                    <input type="text" class="form-control" name="name" value="{$file.name}" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fa fa-save"></i> 保存</button>
            </form>
        </div>
    </div>
</div>
{/block}

{extend name="common/layout" /}

{block name="content"}
<div class="row">
    <div class="col-md-6 col-md-offset-3">
        <div class="content-box">
            <h3><i class="fa fa-folder"></i> 新建目录</h3>
            <hr>
            <form method="post" action="{:url('index/file/createFolder')}">
                <input type="hidden" name="parent_id" value="{$parent_id}">
                <div class="form-group">
                    <label>目录名称</label>
                    <input type="text" class="form-control" name="name" required placeholder="请输入目录名称">
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fa fa-save"></i> 创建</button>
            </form>
        </div>
    </div>
</div>
{/block}

{extend name="common/layout" /}

{block name="content"}
<div class="row">
    <div class="col-md-8 col-md-offset-2">
        <div class="content-box">
            <h3><i class="fa fa-plus"></i> 创建角色</h3>
            <hr>
            <form method="post" action="{:url('index/admin/createRole')}">
                <div class="form-group">
                    <label>角色名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="form-group">
                    <label>角色代码 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="code" required>
                    <small class="text-muted">英文标识，如: editor, viewer</small>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea class="form-control" name="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>权限</label>
                    {if $permission_groups}
                    {foreach $permission_groups as $group}
                    <p style="margin: 10px 0 2px;"><strong>{$group.menu.name}</strong></p>
                    {foreach $group.items as $perm}
                    <div class="checkbox">
                        <label><input type="checkbox" name="permission_ids[]" value="{$perm.id}"> {$perm.name} <small class="text-muted">({$perm.code})</small></label>
                    </div>
                    {/foreach}
                    {/foreach}
                    {else}
                    <p class="text-muted">暂无可用权限,请先到数据库 permissions 表添加</p>
                    {/if}
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 创建</button>
                <a href="{:url('index/admin/roles')}" class="btn btn-default">返回</a>
            </form>
        </div>
    </div>
</div>
{/block}

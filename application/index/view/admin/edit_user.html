{extend name="common/layout" /}

{block name="content"}
<div class="row">
    <div class="col-md-8 col-md-offset-2">
        <div class="content-box">
            <h3><i class="fa fa-edit"></i> 编辑用户</h3>
            <hr>
            <form method="post" action="{:url('index/admin/editUser')}">
                <input type="hidden" name="user_id" value="{$user.id}">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" class="form-control" value="{$user.username}" disabled>
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" class="form-control" name="email" value="{$user.email}">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" class="form-control" name="phone" value="{$user.phone}">
                </div>
                <div class="form-group">
                    <label>存储配额 (字节)</label>
                    <input type="number" class="form-control" name="storage_quota" value="{$user.storage_quota}">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select class="form-control" name="status">
                        <option value="1" {if $user.status == 1}selected{/if}>正常</option>
                        <option value="0" {if $user.status == 0}selected{/if}>禁用</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>角色</label>
                    {foreach $roles as $role}
                    <div class="checkbox">
                        <label>
                            <input type="checkbox" name="role_ids[]" value="{$role.id}" {if in_array($role.id, $user_role_ids)}checked{/if}> {$role.name} ({$role.code})
                        </label>
                    </div>
                    {/foreach}
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 保存</button>
                <a href="{:url('index/admin/users')}" class="btn btn-default">返回</a>
            </form>
        </div>
    </div>
</div>
{/block}

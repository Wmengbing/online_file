{extend name="common/layout" /}

{block name="content"}
<div class="row">
    <div class="col-md-8 col-md-offset-2">
        <div class="content-box">
            <h3><i class="fa fa-edit"></i> 编辑角色</h3>
            <hr>
            <form method="post" action="{:url('index/admin/editRole')}">
                <input type="hidden" name="role_id" value="{$role.id}">
                <div class="form-group">
                    <label>角色名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="name" value="{$role.name}" required>
                </div>
                <div class="form-group">
                    <label>角色代码 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="code" value="{$role.code}" required>
                    <small class="text-muted">英文标识，如: editor, viewer</small>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea class="form-control" name="description" rows="3">{$role.description}</textarea>
                </div>
                <div class="form-group">
                    <label>权限</label>
                    {if $permission_groups}
                    {foreach $permission_groups as $group}
                    <p style="margin: 10px 0 2px;"><strong>{$group.menu.name}</strong></p>
                    {foreach $group.items as $perm}
                    <div class="checkbox">
                        <label><input type="checkbox" name="permission_ids[]" value="{$perm.id}" {if in_array($perm.id, $role_permissions)}checked{/if}> {$perm.name} <small class="text-muted">({$perm.code})</small></label>
                    </div>
                    {/foreach}
                    {/foreach}
                    {else}
                    <p class="text-muted">暂无可用权限</p>
                    {/if}
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select class="form-control" name="status">
                        <option value="1" {if $role.status == 1}selected{/if}>正常</option>
                        <option value="0" {if $role.status == 0}selected{/if}>禁用</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 保存</button>
                <a href="{:url('index/admin/roles')}" class="btn btn-default">返回</a>
            </form>
        </div>
    </div>
</div>
{/block}

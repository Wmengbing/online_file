{extend name="common/layout" /}

{block name="content"}
<div class="row">
    <div class="col-md-8 col-md-offset-2">
        <div class="content-box">
            <h3><i class="fa fa-plus"></i> 创建用户</h3>
            <hr>
            <form method="post" action="{:url('index/admin/createUser')}">
                <div class="form-group">
                    <label>用户名 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="username" required minlength="3" maxlength="50">
                </div>
                <div class="form-group">
                    <label>密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" name="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" class="form-control" name="email">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" class="form-control" name="phone">
                </div>
                <div class="form-group">
                    <label>存储配额 (字节)</label>
                    <input type="number" class="form-control" name="storage_quota" value="10737418240">
                    <small class="text-muted">默认10GB (10737418240字节)</small>
                </div>
                <div class="form-group">
                    <label>角色</label>
                    {foreach $roles as $role}
                    <div class="checkbox">
                        <label>
                            <input type="checkbox" name="role_ids[]" value="{$role.id}"> {$role.name} ({$role.code})
                        </label>
                    </div>
                    {/foreach}
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 创建</button>
                <a href="{:url('index/admin/users')}" class="btn btn-default">返回</a>
            </form>
        </div>
    </div>
</div>
{/block}

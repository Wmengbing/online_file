{extend name="common/layout" /}

{block name="content"}
<div class="row">
    <div class="col-md-12">
        <div class="content-box">
            <h3><i class="fa fa-list"></i> 操作日志</h3>
            <hr>
            <form class="form-inline" method="get" style="margin-bottom: 15px;">
                <div class="form-group">
                    <select class="form-control input-sm" name="module">
                        <option value="">全部模块</option>
                        <option value="auth" {if $module=='auth'}selected{/if}>认证</option>
                        <option value="file" {if $module=='file'}selected{/if}>文件</option>
                        <option value="share" {if $module=='share'}selected{/if}>分享</option>
                        <option value="user" {if $module=='user'}selected{/if}>用户</option>
                        <option value="storage" {if $module=='storage'}selected{/if}>存储</option>
                        <option value="recycle" {if $module=='recycle'}selected{/if}>回收站</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control input-sm" name="start_time" placeholder="开始时间" value="{$start_time}">
                </div>
                <div class="form-group">
                    <input type="text" class="form-control input-sm" name="end_time" placeholder="结束时间" value="{$end_time}">
                </div>
                <button type="submit" class="btn btn-sm btn-primary"><i class="fa fa-search"></i> 筛选</button>
            </form>
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户</th>
                        <th>模块</th>
                        <th>操作</th>
                        <th>描述</th>
                        <th>IP</th>
                        <th>状态</th>
                        <th>时间</th>
                    </tr>
                </thead>
                <tbody>
                    {foreach $logs as $log}
                    <tr>
                        <td>{$log.id}</td>
                        <td>{:getUsername($log.user_id)}</td>
                        <td>{$log.module_text}</td>
                        <td>{$log.action_text}</td>
                        <td>{$log.description}</td>
                        <td>{$log.ip}</td>
                        <td>
                            {if $log.status == 1}<span class="label label-success">成功</span>
                            {else}<span class="label label-danger">失败</span>{/if}
                        </td>
                        <td>{$log.created_at}</td>
                    </tr>
                    {/foreach}
                </tbody>
            </table>
        </div>
    </div>
</div>
{/block}

{extend name="common/layout" /}

{block name="content"}
<div class="row">
    <div class="col-md-8 col-md-offset-2">
        <div class="content-box">
            <h3><i class="fa fa-user"></i> 个人资料</h3>
            <hr>
            <form method="post" action="{:url('index/auth/profile')}">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" class="form-control" value="{$user.username}" disabled>
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" class="form-control" name="email" value="{$user.email}">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" class="form-control" name="phone" value="{$user.phone}">
                </div>
                <hr>
                <h4>存储使用情况</h4>
                <div class="storage-bar">
                    <div class="progress progress-bar-striped active" style="width: {$user.storage_percent}%; background: {if $user.storage_percent > 90}#d9534f{elseif $user.storage_percent > 70}#f0ad4e{else}#5cb85c{/if};"></div>
                </div>
                <p class="text-muted">已使用: {$user.storage_used_text} / {$user.storage_quota_text} ({$user.storage_percent}%)</p>
                <hr>
                <p class="text-muted">注册时间: {$user.created_at}</p>
                <p class="text-muted">最后登录: {$user.last_login_time|default='-'}</p>
                <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> 保存</button>
                <a href="{:url('index/file/index')}" class="btn btn-default">返回</a>
            </form>
        </div>
    </div>
</div>
{/block}

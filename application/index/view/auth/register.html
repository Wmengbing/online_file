{extend name="common/layout" /}

{block name="content"}
<style>
    .auth-shell {
        min-height: calc(100vh - 140px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 0;
    }
    .auth-card {
        width: 100%;
        max-width: 520px;
        border-radius: 22px;
        background: rgba(255,255,255,0.96);
        border: 1px solid rgba(226,232,240,0.95);
        box-shadow: 0 24px 50px rgba(15,23,42,0.10);
        padding: 30px 28px 22px;
        position: relative;
        overflow: hidden;
    }
    .auth-card:before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, rgba(16,185,129,0.16), rgba(16,185,129,0));
    }
    .auth-card > * { position: relative; z-index: 1; }
    .auth-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        height: 54px;
        border-radius: 16px;
        margin: 0 auto 14px;
        background: linear-gradient(135deg, #ecfdf5, #d1fae5);
        color: #059669;
        font-size: 24px;
    }
    .auth-title {
        text-align: center;
        margin: 0 0 20px;
        font-weight: 700;
        color: #0f172a;
    }
    .auth-card .form-group {
        margin-bottom: 18px;
    }
    .auth-card label {
        color: #475569;
        font-weight: 600;
        margin-bottom: 8px;
    }
    .auth-card .btn-block {
        width: 100%;
        margin-top: 8px;
        min-height: 44px;
    }
    .auth-card hr {
        border-top-color: #e2e8f0;
        margin: 22px 0 18px;
    }
    .auth-card .text-center {
        color: #64748b;
    }
</style>
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-badge"><i class="fa fa-user-plus"></i></div>
        <h3 class="auth-title">用户注册</h3>
        <form method="post" action="{:url('index/auth/register')}">
            <div class="form-group">
                <label><i class="fa fa-user"></i> 用户名</label>
                <input type="text" class="form-control" name="username" required placeholder="3-50个字符" minlength="3" maxlength="50">
            </div>
            <div class="form-group">
                <label><i class="fa fa-lock"></i> 密码</label>
                <input type="password" class="form-control" name="password" required placeholder="至少6位" minlength="6">
            </div>
            <div class="form-group">
                <label><i class="fa fa-envelope"></i> 邮箱</label>
                <input type="email" class="form-control" name="email" placeholder="选填">
            </div>
            <button type="submit" class="btn btn-success btn-block"><i class="fa fa-user-plus"></i> 注册</button>
        </form>
        <hr>
        <p class="text-center">已有账号？<a href="{:url('index/auth/login')}">立即登录</a></p>
    </div>
</div>
{/block}

{extend name="common/layout" /}

{block name="content"}
<div class="row">
    <div class="col-md-6 col-md-offset-3">
        <div class="content-box" style="margin-top: 50px;">
            <h3 class="text-center"><i class="fa fa-sign-in"></i> 用户登录</h3>
            <hr>
            <form method="post" action="{:url('index/auth/login')}">
                <div class="form-group">
                    <label><i class="fa fa-user"></i> 用户名</label>
                    <input type="text" class="form-control" name="username" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label><i class="fa fa-lock"></i> 密码</label>
                    <input type="password" class="form-control" name="password" required placeholder="请输入密码">
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fa fa-sign-in"></i> 登录</button>
            </form>
            <hr>
            <p class="text-center">还没有账号？<a href="{:url('index/auth/register')}">立即注册</a></p>
        </div>
    </div>
</div>
{/block}

{extend name="common/layout" /}

{block name="content"}
<style>
    .auth-shell {
        min-height: calc(100vh - 140px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 0;
    }
    .auth-card {
        width: 100%;
        max-width: 460px;
        border-radius: 22px;
        background: rgba(255,255,255,0.96);
        border: 1px solid rgba(226,232,240,0.95);
        box-shadow: 0 24px 50px rgba(15,23,42,0.10);
        padding: 30px 28px 22px;
        position: relative;
        overflow: hidden;
    }
    .auth-card:before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(96,165,250,0.18), rgba(96,165,250,0));
    }
    .auth-card > * { position: relative; z-index: 1; }
    .auth-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        height: 54px;
        border-radius: 16px;
        margin: 0 auto 14px;
        background: linear-gradient(135deg, #eff6ff, #dbeafe);
        color: var(--primary);
        font-size: 24px;
    }
    .auth-title {
        text-align: center;
        margin: 0 0 20px;
        font-weight: 700;
        color: #0f172a;
    }
    .auth-card .form-group {
        margin-bottom: 18px;
    }
    .auth-card label {
        color: #475569;
        font-weight: 600;
        margin-bottom: 8px;
    }
    .auth-card .btn-block {
        width: 100%;
        margin-top: 8px;
        min-height: 44px;
    }
    .auth-card hr {
        border-top-color: #e2e8f0;
        margin: 22px 0 18px;
    }
    .auth-card .text-muted {
        color: #64748b !important;
    }
</style>
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-badge"><i class="fa fa-key"></i></div>
        <h3 class="auth-title">修改密码</h3>
        <form method="post" action="{:url('index/auth/changePassword')}" class="ajax-form">
            <div class="form-group">
                <label><i class="fa fa-lock"></i> 旧密码</label>
                <input type="password" class="form-control" name="old_password" required>
            </div>
            <div class="form-group">
                <label><i class="fa fa-lock"></i> 新密码</label>
                <input type="password" class="form-control" name="new_password" required minlength="6">
                <small class="text-muted">至少6位字符</small>
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i class="fa fa-save"></i> 修改密码</button>
        </form>
    </div>
</div>
{/block}

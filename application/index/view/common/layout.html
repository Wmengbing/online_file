<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{block name="title"}文件共享系统{/block}</title>
    <link href="/static/vendor/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-1: #f4f7ff;
            --bg-2: #edf5ff;
            --panel: rgba(255,255,255,0.9);
            --panel-strong: #ffffff;
            --line: #e5edf9;
            --text: #1f2937;
            --muted: #64748b;
            --primary: #2563eb;
            --primary-2: #3b82f6;
            --primary-soft: #eaf2ff;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            background:
                radial-gradient(circle at top left, rgba(59,130,246,0.10), transparent 24%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
            padding-top: 70px;
            color: var(--text);
        }
        a { color: var(--primary); transition: color 0.2s ease; }
        a:hover, a:focus { color: #1d4ed8; text-decoration: none; }
        ::selection { background: rgba(37,99,235,0.16); }
        .container { max-width: 1200px; }
        .navbar {
            margin-bottom: 24px;
            background: rgba(255,255,255,0.9);
            border: none;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
        }
        .navbar-default .navbar-nav > li > a {
            color: #475569;
            font-weight: 500;
            transition: all 0.2s ease;
            border-radius: 8px;
            margin: 8px 4px 6px;
            padding: 8px 12px;
        }
        .navbar-default .navbar-nav > li > a:hover,
        .navbar-default .navbar-nav > li > a:focus,
        .navbar-default .navbar-nav > .active > a,
        .navbar-default .navbar-nav > .active > a:hover,
        .navbar-default .navbar-nav > .active > a:focus {
            background: var(--primary-soft);
            color: var(--primary);
        }
        .navbar-brand {
            color: #0f172a !important;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .navbar-brand .fa {
            color: var(--primary);
            margin-right: 6px;
        }
        .dropdown-menu {
            border: 1px solid rgba(226,232,240,0.9);
            border-radius: 12px;
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.10);
            padding: 8px;
        }
        .dropdown-menu > li > a {
            border-radius: 8px;
            padding: 8px 12px;
            color: #334155;
        }
        .dropdown-menu > li > a:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }
        .sidebar {
            background: rgba(255,255,255,0.92);
            padding: 18px 18px 12px;
            border-radius: 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(226,232,240,0.9);
            box-shadow: var(--shadow);
        }
        .sidebar h4 {
            margin-top: 0;
            font-weight: 700;
            color: #0f172a;
        }
        .sidebar .nav > li > a {
            color: #334155;
            border-radius: 10px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        .sidebar .nav > li > a:hover,
        .sidebar .nav > li.active > a {
            background: linear-gradient(135deg, var(--primary-2), var(--primary));
            color: #fff;
            box-shadow: 0 10px 18px rgba(37,99,235,0.18);
        }
        .content-box {
            background: rgba(255,255,255,0.94);
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(226,232,240,0.9);
            box-shadow: var(--shadow);
        }
        .file-item {
            padding: 12px 10px;
            border-bottom: 1px solid #edf2f7;
            border-radius: 10px;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .file-item:hover {
            background: #f8fbff;
            transform: translateY(-1px);
        }
        .file-icon {
            font-size: 24px;
            margin-right: 10px;
        }
        .file-icon.folder { color: #f59e0b; }
        .file-icon.file { color: #3b82f6; }
        .storage-bar {
            height: 20px;
            background: #edf4ff;
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.08);
        }
        .storage-bar .progress {
            height: 100%;
            margin: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, #7dd3fc, #2563eb);
        }
        .btn-action { margin-right: 5px; }
        .file-name { word-break: break-all; }
        .btn {
            border-radius: 10px;
            padding: 7px 16px;
            transition: all 0.2s ease;
            box-shadow: none;
            border: 1px solid transparent;
            font-weight: 500;
        }
        .btn:hover, .btn:focus {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(15, 23, 42, 0.08);
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-color: #2563eb;
            color: #fff;
        }
        .btn-primary:hover, .btn-primary:focus {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-color: #1d4ed8;
            color: #fff;
        }
        .btn-success {
            background: linear-gradient(135deg, #2dd4bf, #10b981);
            border-color: #10b981;
            color: #fff;
        }
        .btn-success:hover, .btn-success:focus {
            background: linear-gradient(135deg, #14b8a6, #059669);
            border-color: #059669;
            color: #fff;
        }
        .btn-info {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            border-color: #0ea5e9;
            color: #fff;
        }
        .btn-info:hover, .btn-info:focus {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border-color: #0284c7;
            color: #fff;
        }
        .btn-warning {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-color: #f59e0b;
            color: #fff;
        }
        .btn-warning:hover, .btn-warning:focus {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-color: #d97706;
            color: #fff;
        }
        .btn-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
            border-color: #ef4444;
            color: #fff;
        }
        .btn-danger:hover, .btn-danger:focus {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: #dc2626;
            color: #fff;
        }
        .btn-default {
            background: rgba(255,255,255,0.9);
            border-color: #dbe7f5;
            color: #475569;
        }
        .btn-default:hover, .btn-default:focus {
            background: #f8fbff;
            border-color: #bfd3ff;
            color: #1f2937;
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid #dfeaf7;
            padding: 9px 12px;
            box-shadow: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: rgba(255,255,255,0.9);
        }
        .form-control:focus {
            border-color: rgba(59,130,246,0.6);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }
        .table {
            background: rgba(255,255,255,0.7);
            border-radius: 12px;
            overflow: hidden;
        }
        .table > thead > tr > th {
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
            font-weight: 700;
            letter-spacing: 0.01em;
        }
        .table > tbody > tr > td {
            vertical-align: middle;
            border-top: 1px solid #edf2f7;
            color: #334155;
        }
        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: #fbfdff;
        }
        .table-hover > tbody > tr:hover {
            background-color: #f8fbff;
        }
        .text-muted {
            color: var(--muted) !important;
        }
        .nav-pills > li.active > a,
        .nav-pills > li.active > a:hover,
        .nav-pills > li.active > a:focus {
            background: linear-gradient(135deg, var(--primary-2), var(--primary));
            box-shadow: 0 10px 18px rgba(37,99,235,0.16);
        }
        .label,
        .badge {
            border-radius: 999px;
            padding: 4px 8px;
            font-weight: 600;
        }
        .alert {
            border-radius: 14px;
            border: none;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar">
                    <span class="icon-bar"></span><span class="icon-bar"></span><span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="{:url('index/file/index')}"><i class="fa fa-cloud"></i> 文件共享系统</a>
            </div>
            <div id="navbar" class="collapse navbar-collapse">
                <ul class="nav navbar-nav">
                    <li><a href="{:url('index/file/index')}"><i class="fa fa-folder"></i> 我的文件</a></li>
                    <li><a href="{:url('index/share/index')}"><i class="fa fa-share-alt"></i> 我的分享</a></li>
                    <li><a href="{:url('index/share/sharedWithMe')}"><i class="fa fa-users"></i> 共享给我</a></li>
                    <li><a href="{:url('index/recycle/index')}"><i class="fa fa-trash"></i> 回收站</a></li>
                    {if isset($is_admin) && $is_admin}
                    <li><a href="{:url('index/admin/users')}"><i class="fa fa-tasks"></i> 管理后台</a></li>
                    {/if}
                </ul>
                <ul class="nav navbar-nav navbar-right">
                    {if $is_logged_in}
                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown">
                            <i class="fa fa-user"></i> {$user_info.username|default='用户'} <span class="caret"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a href="{:url('index/auth/profile')}"><i class="fa fa-user"></i> 个人资料</a></li>
                            <li><a href="{:url('index/auth/changePassword')}"><i class="fa fa-lock"></i> 修改密码</a></li>
                            <li role="separator" class="divider"></li>
                            <li><a href="{:url('index/auth/logout')}"><i class="fa fa-sign-out"></i> 退出登录</a></li>
                        </ul>
                    </li>
                    {else}
                    <li><a href="{:url('index/auth/login')}"><i class="fa fa-sign-in"></i> 登录</a></li>
                    <li><a href="{:url('index/auth/register')}"><i class="fa fa-user-plus"></i> 注册</a></li>
                    {/if}
                </ul>
            </div>
        </div>
    </nav>

    <!-- 公共 JS 前置加载,保证内容区内联脚本可用 -->
    <script src="/static/vendor/jquery/1.12.4/jquery.min.js"></script>
    <script src="/static/vendor/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="/static/vendor/layer/3.1.1/layer.js"></script>
    <script>
    function ajaxPost(url, data, callback) {
        $.post(url, data, function(res) {
            if (res.code == 200) {
                layer.msg(res.msg, {icon: 1}, function() {
                    if (callback) callback(res);
                    else location.reload();
                });
            } else {
                layer.msg(res.msg || '操作失败', {icon: 2});
            }
        }, 'json');
    }
    </script>

    <div class="container">
        {block name="content"}{/block}
    </div>

    {block name="script"}{/block}
</body>
</html>
